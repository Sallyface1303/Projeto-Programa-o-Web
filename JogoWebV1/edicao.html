<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Edição de perfil</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="layoutEdicao.css">
</head>
<body>
    <div class="conteiner">
        <div class="menu">
            <h1 class="h1">WHACK-A-MOLE</h1> <!-- Colocar  depois um link para a tela inicial -->
            <div class="lineBottom"></div>
        </div>
        <header>
            <span class="line"></span>
            <h1>Alteração de informações</h1>
            <span class="line"></span>
        </header>
        <main>
            <div class="divImg">
                <img src="imagens/fotoPerfil.png" alt="Logo">
            </div>
            <div class="divInfo">
                <p>Nome</p>
                <div class="divUser"></div>
                <br>
                <p>Nome de usuário</p>
                <div class="divUser"></div>
                <br>
                <p>E-mail</p>
                <div class="divUser"></div>
                <br>
                <p>Telefone</p>
                <div class="divUser"></div>
                <br>
                <p>Senha</p>
                <div class="divUser"></div>
                <br>
                <button type="buttonSave"><p>Confirmar</p></button>
            </div>
        </main>
    </div>
</body>
</html>
