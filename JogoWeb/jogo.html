<!DOCTYPE html>
<html lang="en" class="crt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole</title>
    <link rel="stylesheet" href="style_jogo.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playwrite+DE+LA+Guides&display=swap');
    </style>
</head>
<body>
    <div class="header">
        <button type="button" class="pause"></button>
        <label>Whack-a-Mole</label>
    </div>
    <div class="jogo">
        <div class="row">
            <button type="button" class="hole"></button>
            <button type="button" class="hole"></button>
            <button type="button" class="hole"></button>
        </div>
        <div class="row, row2">
            <button type="button" class="hole"></button>
            <button type="button" class="hole"></button>
        </div>
        <div class="row">
            <button type="button" class="hole"></button>
            <button type="button" class="hole"></button>
            <button type="button" class="hole"></button>
        </div>
    </div>
</body>
</html>
